<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <title>水晶燈｜F4-K 產品型錄</title>
  <style>
    :root { color-scheme: dark; --bar-h: 74px; --table: transparent; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: var(--table); }
    body { font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans TC", sans-serif; }
    .catalog { height: 100dvh; display: grid; grid-template-rows: minmax(0, 1fr) auto; }
    .stage { position: relative; min-height: 0; display: grid; place-items: center; overflow: hidden; padding: clamp(18px, 4vmin, 48px) clamp(16px, 5vw, 72px) clamp(30px, 6vmin, 68px); background: var(--table); perspective: 1400px; }
    .page { display: block; width: auto; height: auto; max-width: 100%; max-height: 100%; object-fit: contain; user-select: none; -webkit-user-drag: none; backface-visibility: hidden; transform-style: preserve-3d; box-shadow: 0 7px 5px rgba(0,0,0,.22), 0 20px 24px rgba(0,0,0,.34), 0 38px 50px rgba(0,0,0,.22); }
    .loading { position: absolute; inset: 0; display: grid; place-items: center; color: #aaa; font-size: 14px; pointer-events: none; }
    .page.ready + .loading { display: none; }
    .controls { min-height: var(--bar-h); padding: 10px max(14px, env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left)); display: grid; grid-template-columns: 56px minmax(0, 1fr) 56px; align-items: center; gap: 12px; background: transparent; border-top: 0; box-shadow: none; }
    button { width: 48px; min-height: 40px; border: 1px solid #555; border-radius: 10px; background: #292929; color: #fff; font: inherit; font-weight: 650; cursor: pointer; touch-action: manipulation; display: grid; place-items: center; }
    button svg { width: 22px; height: 22px; fill: currentColor; filter: drop-shadow(0 1px 1px rgba(0,0,0,.35)); }
    button:hover:not(:disabled) { background: #3a3a3a; }
    button:focus-visible { outline: 3px solid #78a9ff; outline-offset: 2px; }
    button:disabled { opacity: .35; cursor: default; }
    #prev { justify-self: start; }
    #next { justify-self: end; background: #f2f2f2; color: #111; border-color: #f2f2f2; }
    #next:hover:not(:disabled) { background: #fff; }
    .status { min-width: 112px; text-align: center; line-height: 1.25; }
    .jump-controls { display: flex; justify-content: space-between; align-items: center; gap: 20px; padding: 0 max(14px, env(safe-area-inset-right)) calc(9px + env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left)); background: transparent; }
    .jump-controls[hidden] { display: none; }
    .jump-controls button { width: auto; min-width: 104px; min-height: 32px; padding: 4px 9px; border: 0; border-radius: 8px; background: rgba(255,255,255,.08); color: #ddd; font-size: 13px; font-weight: 550; }
    .jump-controls button:hover { background: rgba(255,255,255,.15); }
    .title { display: block; width: fit-content; max-width: 38vw; margin-inline: auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #ddd; font-size: 13px; }
    .counter { display: block; margin-top: 3px; color: #fff; font-variant-numeric: tabular-nums; font-size: 15px; }
    @media (max-width: 520px) {
      :root { --bar-h: 66px; }
      .stage { padding: 14px 12px 28px; }
      .controls { grid-template-columns: 48px minmax(0, 1fr) 48px; gap: 8px; padding-top: 8px; }
      button { width: 42px; min-height: 40px; font-size: 14px; }
      .title { display: none; }
      .status { min-width: 72px; }
    }
    @media (prefers-reduced-motion: no-preference) {
      .page { transition: opacity .12s ease; }
      .page.loading-page { opacity: .35; }
      .page.flip-out-next { transform-origin: left center; animation: flip-out-next .22s ease-in both; }
      .page.flip-in-next { transform-origin: right center; animation: flip-in-next .28s cubic-bezier(.2,.75,.25,1) both; }
      .page.flip-out-prev { transform-origin: right center; animation: flip-out-prev .22s ease-in both; }
      .page.flip-in-prev { transform-origin: left center; animation: flip-in-prev .28s cubic-bezier(.2,.75,.25,1) both; }
      @keyframes flip-out-next { to { transform: translateX(-7%) rotateY(-34deg) scale(.97); opacity: 0; filter: brightness(.55); } }
      @keyframes flip-in-next { from { transform: translateX(7%) rotateY(34deg) scale(.97); opacity: 0; filter: brightness(.55); } to { transform: none; opacity: 1; filter: none; } }
      @keyframes flip-out-prev { to { transform: translateX(7%) rotateY(34deg) scale(.97); opacity: 0; filter: brightness(.55); } }
      @keyframes flip-in-prev { from { transform: translateX(-7%) rotateY(-34deg) scale(.97); opacity: 0; filter: brightness(.55); } to { transform: none; opacity: 1; filter: none; } }
    }
    /* Keep the image stage identical whether or not ten-page controls are shown. */
    .catalog { position: relative; }
    .controls { height: var(--bar-h); }
    .jump-controls { position: absolute; left: 0; right: 0; bottom: 0; z-index: 3; height: calc(34px + env(safe-area-inset-bottom)); padding-top: 0; padding-bottom: calc(4px + env(safe-area-inset-bottom)); }
    .catalog.has-jump-controls .controls { padding-top: 4px; padding-bottom: calc(36px + env(safe-area-inset-bottom)); }
    .catalog.has-jump-controls .controls > button { min-height: 30px; }
    @media (max-width: 520px) {
      .controls { grid-template-columns: 42px minmax(0, 1fr) 42px; }
      .controls > button { min-height: 36px; }
      .controls button svg { width: 22px; height: 22px; }
      .catalog.has-jump-controls .controls { padding-top: 3px; padding-bottom: calc(34px + env(safe-area-inset-bottom)); }
      .catalog.has-jump-controls .controls > button { min-height: 28px; }
      .jump-controls { height: calc(32px + env(safe-area-inset-bottom)); padding-bottom: calc(4px + env(safe-area-inset-bottom)); }
      .jump-controls button { min-width: 92px; min-height: 27px; padding: 3px 7px; font-size: 12px; }
    }
    /* Stable two-row navigation for Safari, iPhone and iPad. */
    .jump-controls {
      position: static;
      left: auto;
      right: auto;
      bottom: auto;
      z-index: auto;
      display: flex;
      visibility: visible;
      width: 100%;
      height: calc(38px + env(safe-area-inset-bottom));
      min-height: calc(38px + env(safe-area-inset-bottom));
      padding: 2px max(14px, env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));
    }
    .jump-controls[hidden] {
      display: flex;
      visibility: hidden;
      pointer-events: none;
    }
    .catalog.has-jump-controls .controls {
      padding: 10px max(14px, env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));
    }
    .catalog.has-jump-controls .controls > button { min-height: 46px; }
    @media (max-width: 520px) {
      .controls,
      .catalog.has-jump-controls .controls {
        padding-top: 7px;
        padding-bottom: calc(7px + env(safe-area-inset-bottom));
      }
      .controls > button,
      .catalog.has-jump-controls .controls > button { min-height: 34px; }
      .jump-controls {
        height: calc(34px + env(safe-area-inset-bottom));
        min-height: calc(34px + env(safe-area-inset-bottom));
        padding: 1px max(14px, env(safe-area-inset-right)) calc(5px + env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));
      }
      .jump-controls button { min-width: 92px; min-height: 28px; }
    }
  </style>
</head>
<body>
  <main class="catalog" aria-label="水晶燈產品型錄">
    <section class="stage" id="stage">
      <img class="page" id="page" alt="" draggable="false">
      <div class="loading" aria-live="polite">載入中…</div>
    </section>
    <nav class="controls" aria-label="型錄翻頁">
      <button id="prev" type="button" aria-label="上一頁" title="上一頁"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.7 4.3a1 1 0 0 1 0 1.4L9.4 12l6.3 6.3a1 1 0 1 1-1.4 1.4l-7-7a1 1 0 0 1 0-1.4l7-7a1 1 0 0 1 1.4 0Z"/></svg></button>
      <div class="status" aria-live="polite">
        <span class="title">水晶燈</span>
        <span class="counter"><span id="current">1</span> / <span id="total">0</span></span>
      </div>
      <button id="next" type="button" aria-label="下一頁" title="下一頁"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.3 19.7a1 1 0 0 1 0-1.4l6.3-6.3-6.3-6.3a1 1 0 1 1 1.4-1.4l7 7a1 1 0 0 1 0 1.4l-7 7a1 1 0 0 1-1.4 0Z"/></svg></button>
    </nav>
    <nav class="jump-controls" id="jumpControls" aria-label="快速翻頁" hidden>
      <button id="jumpPrev" type="button" aria-label="往前10頁">|&lt;&lt;&nbsp; 前10頁</button>
      <button id="jumpNext" type="button" aria-label="往後10頁">後10頁 &nbsp;&gt;&gt;|</button>
    </nav>
  </main>
  <script>
    const pages = ["01-crystal-lighting-cover.png","f4-k-002.jpg","f4-k-003.jpg","f4-k-004.jpg","f4-k-005.jpg","f4-k-006.jpg","f4-k-007.jpg","f4-k-008.jpg","f4-k-009.jpg","f4-k-010.jpg","f4-k-011.jpg","f4-k-012.jpg","f4-k-013.jpg","f4-k-014.jpg","f4-k-015.jpg","f4-k-016.jpg","f4-k-017.jpg","f4-k-018.jpg","f4-k-019.jpg","f4-k-020.jpg","f4-k-021.jpg","f4-k-022.jpg","f4-k-023.jpg","f4-k-024.jpg","f4-k-025.jpg","f4-k-026.jpg","f4-k-027.jpg","f4-k-028.jpg","f4-k-029.jpg","f4-k-030.jpg","f4-k-031.jpg","f4-k-032.jpg","f4-k-033.jpg","f4-k-034.jpg","f4-k-035.jpg","f4-k-036.jpg","f4-k-037.jpg","f4-k-038.jpg","f4-k-039.jpg","f4-k-040.jpg","f4-k-041.jpg","f4-k-042.jpg","f4-k-043.jpg","f4-k-044.jpg","f4-k-045.jpg","f4-k-046.jpg","f4-k-047.jpg","f4-k-048.jpg","f4-k-049.jpg","f4-k-050.jpg","f4-k-051.jpg","f4-k-052.jpg","f4-k-053.jpg","f4-k-054.jpg","f4-k-055.jpg","f4-k-056.jpg","f4-k-057.jpg","f4-k-058.jpg","f4-k-059.jpg","f4-k-060.jpg","f4-k-061.jpg","f4-k-062.jpg","f4-k-063.jpg","f4-k-064.jpg","f4-k-065.jpg","f4-k-066.jpg","f4-k-067.jpg","f4-k-068.jpg","f4-k-069.jpg","f4-k-070.jpg","f4-k-130.jpg","f4-k-131.jpg","f4-k-132.jpg","f4-k-133.jpg","f4-k-134.jpg","f4-k-135.jpg","f4-k-136.jpg","f4-k-137.jpg","f4-k-138.jpg","f4-k-139.jpg","f4-k-140.jpg","f4-k-141.jpg","f4-k-142.jpg"];
    const image = document.getElementById('page');
    const prev = document.getElementById('prev');
    const next = document.getElementById('next');
    const current = document.getElementById('current');
    const total = document.getElementById('total');
    const stage = document.getElementById('stage');
    const catalog = document.querySelector('.catalog');
    const jumpControls = document.getElementById('jumpControls');
    const jumpPrev = document.getElementById('jumpPrev');
    const jumpNext = document.getElementById('jumpNext');
    let index = Math.min(Math.max(Number(location.hash.slice(1)) - 1 || 0, 0), pages.length - 1);
    let touchStartX = 0;
    let animating = false;

    total.textContent = pages.length;

    function preload(i) {
      if (pages[i]) { const img = new Image(); img.src = pages[i]; }
    }

    function show(i, updateHash = true) {
      if (!pages.length) return;
      index = Math.min(Math.max(i, 0), pages.length - 1);
      image.classList.remove('ready');
      image.classList.add('loading-page');
      image.alt = `水晶燈型錄第 ${index + 1} 頁`;
      image.onload = () => {
        image.classList.add('ready');
        image.classList.remove('loading-page');
        preload(index - 1); preload(index + 1);
      };
      image.src = pages[index];
      current.textContent = index + 1;
      prev.disabled = pages.length < 2;
      next.disabled = pages.length < 2;
      jumpControls.hidden = pages.length <= 20;
      catalog.classList.toggle('has-jump-controls', pages.length > 20);
      if (updateHash) history.replaceState(null, '', `#${index + 1}`);
    }

    function turn(target) {
      if (animating || pages.length < 2) return;
      const direction = target > index ? 'next' : 'prev';
      target = ((target % pages.length) + pages.length) % pages.length;
      if (target === index) return;
      if (matchMedia('(prefers-reduced-motion: reduce)').matches) { show(target); return; }
      animating = true;
      image.classList.add(`flip-out-${direction}`);
      setTimeout(() => {
        image.classList.remove(`flip-out-${direction}`);
        show(target);
        image.classList.add(`flip-in-${direction}`);
        image.addEventListener('animationend', () => {
          image.classList.remove(`flip-in-${direction}`);
          animating = false;
        }, { once: true });
      }, 220);
    }

    prev.addEventListener('click', () => turn(index - 1));
    next.addEventListener('click', () => turn(index + 1));
    jumpPrev.addEventListener('click', () => turn(index - 10));
    jumpNext.addEventListener('click', () => turn(index + 10));
    addEventListener('keydown', e => {
      if (['ArrowLeft', 'PageUp'].includes(e.key)) { e.preventDefault(); turn(index - 1); }
      if (['ArrowRight', 'PageDown', ' '].includes(e.key)) { e.preventDefault(); turn(index + 1); }
      if (e.key === 'Home') { e.preventDefault(); turn(0); }
      if (e.key === 'End') { e.preventDefault(); turn(pages.length - 1); }
    });
    addEventListener('hashchange', () => show(Number(location.hash.slice(1)) - 1 || 0, false));
    stage.addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].clientX; }, { passive: true });
    stage.addEventListener('touchend', e => {
      const dx = e.changedTouches[0].clientX - touchStartX;
      if (Math.abs(dx) > 50) turn(index + (dx < 0 ? 1 : -1));
    }, { passive: true });
    show(index);
  </script>
</body>
</html>
