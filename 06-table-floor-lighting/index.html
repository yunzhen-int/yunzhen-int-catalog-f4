<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <title>桌燈・立燈｜F4-K 產品型錄</title>
  <style>
    :root { color-scheme: dark; --bar-h: 74px; --table: transparent; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: var(--table); }
    body { font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans TC", sans-serif; }
    .catalog { height: 100dvh; display: grid; grid-template-rows: minmax(0, 1fr) auto; }
    .stage { position: relative; min-height: 0; display: grid; place-items: center; overflow: hidden; padding: clamp(18px, 4vmin, 48px) clamp(16px, 5vw, 72px) clamp(30px, 6vmin, 68px); background: var(--table); perspective: 1400px; }
    .page { display: block; width: auto; height: auto; max-width: 100%; max-height: 100%; object-fit: contain; user-select: none; -webkit-user-drag: none; backface-visibility: hidden; transform-style: preserve-3d; box-shadow: 0 7px 5px rgba(0,0,0,.22), 0 20px 24px rgba(0,0,0,.34), 0 38px 50px rgba(0,0,0,.22); }
    .loading { position: absolute; inset: 0; display: grid; place-items: center; color: #aaa; font-size: 14px; pointer-events: none; }
    .page.ready + .loading { display: none; }
    .controls { min-height: var(--bar-h); padding: 10px max(14px, env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left)); display: grid; grid-template-columns: 56px minmax(0, 1fr) 56px; align-items: center; gap: 12px; background: transparent; border-top: 0; box-shadow: none; }
    button { width: 48px; min-height: 40px; border: 1px solid #555; border-radius: 10px; background: #292929; color: #fff; font: inherit; font-weight: 650; cursor: pointer; touch-action: manipulation; display: grid; place-items: center; }
    button svg { width: 22px; height: 22px; fill: currentColor; filter: drop-shadow(0 1px 1px rgba(0,0,0,.35)); }
    button:hover:not(:disabled) { background: #3a3a3a; }
    button:focus-visible { outline: 3px solid #78a9ff; outline-offset: 2px; }
    button:disabled { opacity: .35; cursor: default; }
    #prev { justify-self: start; }
    #next { justify-self: end; background: #f2f2f2; color: #111; border-color: #f2f2f2; }
    #next:hover:not(:disabled) { background: #fff; }
    .status { min-width: 112px; text-align: center; line-height: 1.25; }
    .title { display: block; width: fit-content; max-width: 38vw; margin-inline: auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #ddd; font-size: 13px; }
    .counter { display: block; margin-top: 3px; color: #fff; font-variant-numeric: tabular-nums; font-size: 15px; }
    .line-float { position: fixed; left: clamp(10px, 2vw, 24px); bottom: calc(var(--bar-h) + 12px); z-index: 20; display: block; width: clamp(190px, 24vw, 310px); aspect-ratio: 902 / 400; overflow: hidden; filter: drop-shadow(0 8px 14px rgba(0,0,0,.24)); transition: transform .18s ease, filter .18s ease; }
    .line-float:hover { transform: translateY(-3px) scale(1.02); filter: drop-shadow(0 10px 18px rgba(0,0,0,.3)); }
    .line-float:focus-visible { outline: 3px solid #78a9ff; outline-offset: 4px; border-radius: 18px; }
    .line-float img { position: absolute; width: 107.54%; max-width: none; height: auto; left: -3.77%; top: -27.25%; }    @media (max-width: 520px) {
      :root { --bar-h: 66px; }
      .stage { padding: 14px 12px 28px; }
      .line-float { width: clamp(160px, 46vw, 220px); bottom: calc(var(--bar-h) + 8px); }
      .controls { grid-template-columns: 48px minmax(0, 1fr) 48px; gap: 8px; padding-top: 8px; }
      button { width: 42px; min-height: 40px; font-size: 14px; }
      .title { display: none; }
      .status { min-width: 72px; }
    }
    @media (prefers-reduced-motion: no-preference) {
      .page { transition: opacity .12s ease; }
      .page.loading-page { opacity: .35; }
      .page.flip-out-next { transform-origin: left center; animation: flip-out-next .22s ease-in both; }
      .page.flip-in-next { transform-origin: right center; animation: flip-in-next .28s cubic-bezier(.2,.75,.25,1) both; }
      .page.flip-out-prev { transform-origin: right center; animation: flip-out-prev .22s ease-in both; }
      .page.flip-in-prev { transform-origin: left center; animation: flip-in-prev .28s cubic-bezier(.2,.75,.25,1) both; }
      @keyframes flip-out-next { to { transform: translateX(-7%) rotateY(-34deg) scale(.97); opacity: 0; filter: brightness(.55); } }
      @keyframes flip-in-next { from { transform: translateX(7%) rotateY(34deg) scale(.97); opacity: 0; filter: brightness(.55); } to { transform: none; opacity: 1; filter: none; } }
      @keyframes flip-out-prev { to { transform: translateX(7%) rotateY(34deg) scale(.97); opacity: 0; filter: brightness(.55); } }
      @keyframes flip-in-prev { from { transform: translateX(-7%) rotateY(-34deg) scale(.97); opacity: 0; filter: brightness(.55); } to { transform: none; opacity: 1; filter: none; } }
    }
  </style>
</head>
<body>
  <main class="catalog" aria-label="桌燈・立燈產品型錄">
    <section class="stage" id="stage">
      <img class="page" id="page" alt="" draggable="false">
      <div class="loading" aria-live="polite">載入中…</div>
    </section>
    <nav class="controls" aria-label="型錄翻頁">
      <button id="prev" type="button" aria-label="上一頁" title="上一頁"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.7 4.3a1 1 0 0 1 0 1.4L9.4 12l6.3 6.3a1 1 0 1 1-1.4 1.4l-7-7a1 1 0 0 1 0-1.4l7-7a1 1 0 0 1 1.4 0Z"/></svg></button>
      <div class="status" aria-live="polite">
        <span class="title">桌燈・立燈</span>
        <span class="counter"><span id="current">1</span> / <span id="total">0</span></span>
      </div>
      <button id="next" type="button" aria-label="下一頁" title="下一頁"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.3 19.7a1 1 0 0 1 0-1.4l6.3-6.3-6.3-6.3a1 1 0 1 1 1.4-1.4l7 7a1 1 0 0 1 0 1.4l-7 7a1 1 0 0 1-1.4 0Z"/></svg></button>
    </nav>
    <a class="line-float" href="https://lin.ee/uh5jinV" target="_blank" rel="noopener noreferrer" aria-label="使用 LINE 諮詢燈具與預約服務">
      <img src="../floating-line-link.png" alt="需要燈具建議嗎？歡迎使用 LINE 諮詢及預約服務">
    </a>
  </main>
  <script>
    const pages = ["06-table-floor-lighting-cover.png","f4-k-499.jpg","f4-k-500.jpg","f4-k-501.jpg","f4-k-502.jpg","f4-k-503.jpg","f4-k-504.jpg","f4-k-505.jpg","f4-k-506.jpg"];
    const image = document.getElementById('page');
    const prev = document.getElementById('prev');
    const next = document.getElementById('next');
    const current = document.getElementById('current');
    const total = document.getElementById('total');
    const stage = document.getElementById('stage');
    let index = Math.min(Math.max(Number(location.hash.slice(1)) - 1 || 0, 0), pages.length - 1);
    let touchStartX = 0;
    let animating = false;

    total.textContent = pages.length;

    function preload(i) {
      if (pages[i]) { const img = new Image(); img.src = pages[i]; }
    }

    function show(i, updateHash = true) {
      if (!pages.length) return;
      index = Math.min(Math.max(i, 0), pages.length - 1);
      image.classList.remove('ready');
      image.classList.add('loading-page');
      image.alt = `桌燈・立燈型錄第 ${index + 1} 頁`;
      image.onload = () => {
        image.classList.add('ready');
        image.classList.remove('loading-page');
        preload(index - 1); preload(index + 1);
      };
      image.src = pages[index];
      current.textContent = index + 1;
      prev.disabled = index === 0;
      next.disabled = index === pages.length - 1;
      if (updateHash) history.replaceState(null, '', `#${index + 1}`);
    }

    function turn(target) {
      if (animating || target < 0 || target >= pages.length || target === index) return;
      const direction = target > index ? 'next' : 'prev';
      if (matchMedia('(prefers-reduced-motion: reduce)').matches) { show(target); return; }
      animating = true;
      image.classList.add(`flip-out-${direction}`);
      setTimeout(() => {
        image.classList.remove(`flip-out-${direction}`);
        show(target);
        image.classList.add(`flip-in-${direction}`);
        image.addEventListener('animationend', () => {
          image.classList.remove(`flip-in-${direction}`);
          animating = false;
        }, { once: true });
      }, 220);
    }

    prev.addEventListener('click', () => turn(index - 1));
    next.addEventListener('click', () => turn(index + 1));
    addEventListener('keydown', e => {
      if (['ArrowLeft', 'PageUp'].includes(e.key)) { e.preventDefault(); turn(index - 1); }
      if (['ArrowRight', 'PageDown', ' '].includes(e.key)) { e.preventDefault(); turn(index + 1); }
      if (e.key === 'Home') { e.preventDefault(); turn(0); }
      if (e.key === 'End') { e.preventDefault(); turn(pages.length - 1); }
    });
    addEventListener('hashchange', () => show(Number(location.hash.slice(1)) - 1 || 0, false));
    stage.addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].clientX; }, { passive: true });
    stage.addEventListener('touchend', e => {
      const dx = e.changedTouches[0].clientX - touchStartX;
      if (Math.abs(dx) > 50) turn(index + (dx < 0 ? 1 : -1));
    }, { passive: true });
    show(index);
  </script>
</body>
</html>
